# Runs the chat the way it would run in production: two API instances behind a load balancer,
# connected through Redis.
#
#   client ──▶ nginx (round robin) ──▶ api-1 ─┐
#                                  └──▶ api-2 ─┼──▶ PostgreSQL
#                                             └──▶ Redis (backplane, presence, keys)

x-api: &api
  image: onlinechatwithsignalr
  build:
    context: .
    dockerfile: OnlineChatWithSignalR/Dockerfile
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

x-api-environment: &api-environment
  ASPNETCORE_ENVIRONMENT: Development
  ConnectionStrings__Chat: "Host=postgres;Port=5432;Database=chat;Username=postgres;Password=postgres"
  ConnectionStrings__Redis: "redis:6379"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: chat
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chat"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api-1:
    <<: *api
    environment:
      <<: *api-environment
      # Only one instance applies migrations, so two instances don't race to migrate
      Database__MigrateOnStartup: "true"

  api-2:
    <<: *api
    environment:
      <<: *api-environment
      Database__MigrateOnStartup: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api-1:
        condition: service_started

  loadbalancer:
    image: nginx:1.27-alpine
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "5000:80"
    depends_on:
      - api-1
      - api-2

  client:
    image: client
    build:
      context: .
      dockerfile: Client/Dockerfile
    environment:
      # The client only knows the load balancer, not the individual API instances
      ChatApi__BaseUrl: "http://loadbalancer:80"
    ports:
      - "5062:8080"
    depends_on:
      - loadbalancer

volumes:
  postgres-data:
