services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: chat
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chat"]
      interval: 5s
      timeout: 3s
      retries: 10

  onlinechatwithsignalr:
    image: onlinechatwithsignalr
    build:
      context: .
      dockerfile: OnlineChatWithSignalR/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Chat: "Host=postgres;Port=5432;Database=chat;Username=postgres;Password=postgres"
      Database__MigrateOnStartup: "true"
    ports:
      - "5000:8080"
    depends_on:
      postgres:
        condition: service_healthy

  client:
    image: client
    build:
      context: .
      dockerfile: Client/Dockerfile
    environment:
      # Inside Docker the client reaches the API by its service name
      ChatApi__BaseUrl: "http://onlinechatwithsignalr:8080"
    ports:
      - "5062:8080"
    depends_on:
      - onlinechatwithsignalr

volumes:
  postgres-data:
