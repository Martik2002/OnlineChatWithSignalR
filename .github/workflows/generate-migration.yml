name: Generate migration

on:
  push:
    branches: [ feature/rooms-and-messages ]

permissions:
  contents: write

jobs:
  migration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Build
        run: |
          dotnet build OnlineChatWithSignalR/OnlineChatWithSignalR.csproj 2>&1 | tee build.log || true
          grep -E 'error [A-Z]+[0-9]+' build.log | sort -u | head -20 | while read -r line; do echo "::error title=build::$line"; done
          ! grep -qE 'error [A-Z]+[0-9]+' build.log

      - name: Generate migration
        if: hashFiles('OnlineChatWithSignalR/Migrations/*_AddRoomsAndMessages.cs') == ''
        env:
          ConnectionStrings__Chat: "Host=localhost;Database=design;Username=postgres;Password=postgres"
        run: |
          dotnet tool install --global dotnet-ef --version 9.0.8
          dotnet ef migrations add AddRoomsAndMessages --project OnlineChatWithSignalR/OnlineChatWithSignalR.csproj --output-dir Migrations > ef.log 2>&1 || { tail -30 ef.log | while read -r line; do echo "::error title=ef::$line"; done; exit 1; }
          git config user.name "Martik"
          git config user.email "avagyanmartik05@gmail.com"
          git add OnlineChatWithSignalR/Migrations
          git commit -m "feat: add migration for rooms and messages"
          git push
