# Round-robin load balancer in front of the API instances.
# No sticky sessions: the chat client connects with WebSockets directly (no negotiate request),
# and the Redis backplane delivers messages between instances.
events {}

http {
    # Upgrade the connection when the client asks for WebSockets
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream chat_api {
        server api-1:8080;
        server api-2:8080;
    }

    server {
        listen 80;

        # Shows which instance served the request (useful to see round-robin in action)
        add_header X-Upstream $upstream_addr always;

        location / {
            proxy_pass http://chat_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # WebSocket connections stay open for a long time
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
        }
    }
}
